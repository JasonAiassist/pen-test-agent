<!DOCTYPE html>
<!--
  Word-optimised variant of the penenv report template. LibreOffice's HTML->Writer
  importer is slow and unreliable with flex/grid/gradient CSS, so this template keeps a
  deliberately light, document-flow stylesheet (headings, tables, pre, lists only). It
  produces the SAME content as report_template.html but as a clean flowing Word document.
  Tokens filled by report.py: TITLE, BRAND, CONTENT, GENERATED (each wrapped in double braces).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;color:#1b222b;font-size:11pt;line-height:1.4}
h1{font-size:20pt;color:#082a4a;margin:0 0 6pt}
h2{font-size:15pt;color:#0b3d6b;border-bottom:1pt solid #0b3d6b;padding-bottom:3pt;margin:18pt 0 8pt}
h3{font-size:12.5pt;color:#082a4a;margin:14pt 0 4pt}
h4{font-size:11pt;color:#0b3d6b;margin:10pt 0 2pt}
p{margin:0 0 8pt}
code{font-family:Consolas,monospace;font-size:10pt;background:#f0f3f7}
pre{font-family:Consolas,monospace;font-size:9.5pt;background:#f0f3f7;border:1pt solid #d8dee6;padding:8pt;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;margin:0 0 10pt}
th,td{border:1pt solid #b9c2cc;padding:4pt 6pt;text-align:left;vertical-align:top;font-size:10pt}
th{background:#eef2f6}
.cover-ttl{font-size:26pt;color:#0b3d6b;font-weight:bold;margin:40pt 0 4pt}
.cover-sub{font-size:14pt;color:#5b6670;margin:0 0 20pt}
.sev-critical{color:#9b1c1c;font-weight:bold}
.sev-high{color:#c2410c;font-weight:bold}
.sev-medium{color:#b45309;font-weight:bold}
.sev-low{color:#2563eb;font-weight:bold}
.sev-info{color:#475569;font-weight:bold}
.muted{color:#5b6670}
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
