# Demo/integration target for the penenv environment.
# OWASP Juice Shop - an intentionally vulnerable SaaS-style application.
# NEVER point production systems at penenv scans; only apps you own.
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: penenv-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
